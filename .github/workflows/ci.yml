name: Test manual-GT pipeline
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and tests
        run: python -m pip install -e '.[test]'
      - name: Compile
        run: python -m compileall -q src tests
      - name: Synthetic NIfTI and epoch-based train tests
        run: python -m pytest -q
